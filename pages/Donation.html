<style>
    :root {
    --primary-color: #121c54;
    --secondary-color: #1e2a6b;
    --third-color: #2a3782;
    --white-color: white;
    --danger-color: #ff3d00;
    --light-blue: #3a4a9c;
    --dark-blue: #121c54;
    --btn-color: #2a3782;
    --dark-brown: #121c54;
    --light-brown: #3a4a9c;
    --light-gray: #e8eaf6;
    --op-gray: #c5cae9;
    --light-yellow: #e8eaf6;
    --degree-one-white: #f5f6fa;
    --card-color: #ffffff;
    --shadow-sm: 0 2px 4px rgba(18, 28, 84, 0.1);
    --shadow-md: 0 4px 6px rgba(18, 28, 84, 0.1);
    --shadow-lg: 0 10px 15px rgba(18, 28, 84, 0.1);
    --transition: all 0.3s ease;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: var(--background-light);
    line-height: 1.6;
}

.header {
    position: relative;
    height: 500px;
    background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)),
                 url('../assets/Images/\(15\).jpg');
    background-size: cover;
    background-position: center;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: white;
    text-align: center;
    animation: fadeIn 1s ease-in;
}

@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

.donation-container {
    max-width: 900px;
    margin: -50px auto 2rem;
    padding: 2.5rem;
    background: white;
    border-radius: 20px;
    box-shadow: var(--shadow-lg);
    position: relative;
    z-index: 1;
}

.donation-header {
    text-align: center;
    margin-bottom: 2rem;
}

.donation-header h1 {
    color: var(--primary-color);
    font-weight: 800;
    font-size: 2.5rem;
    margin-bottom: 1rem;
    text-shadow: var(--shadow-sm);
}

.donation-header p {
    color: var(--secondary-color);
    font-size: 1.2rem;
    font-weight: 500;
}

h5 {
    margin-bottom: 1rem;
    font-weight: 600;
}

.progress-bar-container {
    width: 100%;
    height: 25px;
    background-color: var(--background-light);
    border-radius: 15px;
    overflow: hidden;
    box-shadow: var(--shadow-sm);
}

.progress-bar {
    height: 100%;
    background: linear-gradient(45deg, var(--primary-color), var(--light-blue));
    color: white;
    text-align: center;
    line-height: 25px;
    font-size: 1rem;
    font-weight: 600;
    transition: var(--transition);
    animation: progressAnimation 1.5s ease-out;
}

@keyframes progressAnimation {
    from { width: 0; }
}

.progress-stats {
    display: flex;
    justify-content: space-between;
    margin-top: 0.5rem;
    color: var(--text-muted);
    font-size: 0.9rem;
}

.amount-options {
    display: flex;
    gap: 1rem;
    flex-wrap: wrap;
    margin-bottom: 2rem;
}

.amount-option {
    flex: 1;
    min-width: 100px;
}

   .amount-option input[type="radio"] {
    display: none;
}

.amount-option label {
    display: block;
    padding: 1.2rem;
    text-align: center;
    background: var(--light-gray);
    border: 2px solid var(--op-gray);
    border-radius: 15px;
    cursor: pointer;
    transition: var(--transition);
    font-weight: 600;
    font-size: 1.1rem;
}

.amount-option label:hover {
    transform: translateY(-3px);
    box-shadow: var(--shadow-md);
    border-color: var(--primary-color);
    background: var(--degree-one-white);
}

.amount-option input[type="radio"]:checked + label {
    background: linear-gradient(45deg, var(--primary-color), var(--light-blue));
    color: white;
    border-color: var(--primary-color);
    transform: translateY(-3px);
    box-shadow: var(--shadow-md);
}

.custom-amount {
    margin-top: 1rem;
}

.input-group {
    display: flex;
    align-items: center;
    margin-top: 0.8rem;
    box-shadow: var(--shadow-sm);
    border-radius: 10px;
    overflow: hidden;
}

.dollar-symbol {
    padding: 0.8rem 1.2rem;
    background: var(--light-gray);
    border: 1px solid var(--op-gray);
    border-right: none;
    font-weight: 600;
    color: var(--secondary-color);
}

input[type="number"],
input[type="text"],
input[type="email"] {
    width: 100%;
    padding: 0.8rem 1.2rem;
    border: 1px solid var(--op-gray);
    border-radius: 10px;
    font-size: 1.1rem;
    transition: var(--transition);
    background-color: var(--light-gray);
}

input[type="number"]:focus,
input[type="text"]:focus,
input[type="email"]:focus {
    outline: none;
    border-color: var(--primary-color);
    box-shadow: 0 0 0 3px rgba(18, 28, 84, 0.1);
    background-color: var(--degree-one-white);
}

.input-group input[type="number"] {
    border-radius: 0 5px 5px 0;
}

.checkbox-group {
    display: flex;
    align-items: center;
    gap: 0.5rem;
}

.aid {
    margin: 2rem 0;
    padding: 1rem;
    background: var(--background-light);
    border-radius: 10px;
}

.aid small {
    display: block;
    margin-top: 0.5rem;
    color: var(--text-muted);
}

.form-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 1rem;
    margin-top: 1rem;
}

.form-group {
    width: 100%;
}

.form-group.full-width {
    grid-column: 1 / -1;
}

.card-input {
    border: 1px solid var(--op-gray);
    padding: 1.5rem;
    border-radius: 15px;
    background: var(--light-gray);
    box-shadow: var(--shadow-sm);
    transition: var(--transition);
}

.card-input:focus-within {
    box-shadow: var(--shadow-md);
    border-color: var(--primary-color);
    background: var(--degree-one-white);
}

.donate-button {
    background: linear-gradient(45deg, var(--primary-color), var(--light-blue));
    color: white;
    padding: 1.2rem 2.5rem;
    border: none;
    border-radius: 15px;
    width: 100%;
    font-size: 1.3rem;
    font-weight: 600;
    margin-top: 2.5rem;
    cursor: pointer;
    transition: var(--transition);
    text-transform: uppercase;
    letter-spacing: 1px;
}

.donate-button:hover {
    background: linear-gradient(45deg, var(--secondary-color), var(--third-color));
    transform: translateY(-3px);
    box-shadow: var(--shadow-lg);
}

.donate-button:active {
    transform: translateY(-1px);
    background: linear-gradient(45deg, var(--dark-blue), var(--light-blue));
}

@media (max-width: 768px) {
    .donation-container {
        margin: -30px 1rem 1rem;
        padding: 1.5rem;
    }

    .donation-header h1 {
        font-size: 2rem;
    }

    .amount-option {
        min-width: calc(50% - 0.5rem);
    }

    .donate-button {
        padding: 1rem 2rem;
        font-size: 1.1rem;
    }
} 
</style>

    <section class="donation-container">
        <div class="donation-header">
            <h1>Make a Donation</h1>
            <p>Your generosity makes a difference</p>
        </div>
        <div class="progress-section">
            <h5>Campaign Progress</h5>
            <div class="progress-bar-container">
                <div class="progress-bar" style="width: 65%;">65%</div>
            </div>
            <div class="progress-stats">
                <span>Raised: $6,500</span>
                <span>Goal: $10,000</span>
            </div>
 </div>
        <form id="donationForm">  
            <h5>Select Donation Amount</h5>
         <div class="amount-options">
                <div class="amount-option">
                    <input type="radio" name="amount" id="amount25" value="25">
                    <label for="amount25">$25</label>
                </div>
                <div class="amount-option">
                    <input type="radio" name="amount" id="amount50" value="50">
                    <label for="amount50">$50</label>
                </div>
                <div class="amount-option">
                    <input type="radio" name="amount" id="amount100" value="100">
                    <label for="amount100">$100</label>
                </div>
                <div class="amount-option">
                    <input type="radio" name="amount" id="amount200" value="200">
                    <label for="amount200">$200</label>
                </div>
            </div>

            <div class="custom-amount">
                <label for="customAmount">Custom Amount</label>
                <div class="input-group">
                    <span class="dollar-symbol">$</span>
                    <input type="number" id="customAmount" placeholder="Enter amount">
                </div>
            </div>

            <div class="aid">
                <div class="checkbox-group">
                    <input type="checkbox" id="giftAid">
                    <label for="giftAid">
                        I am a UK taxpayer and would like to Gift Aid my donation
                    </label>
                </div>
                <small>This will add 25% to your donation at no extra cost to you</small>
            </div>
 <div class="donor-info">
                <h5>Your Information</h5>
                <div class="form-grid">
                    <div class="form-group">
                        <input type="text" placeholder="First Name" required id="firstName">
                    </div>
                    <div class="form-group">
                        <input type="text" placeholder="Last Name" required id="lastName">
                    </div>
                    <div class="form-group full-width">
                        <input type="email" placeholder="Email Address" required id="emailAddress">
                    </div>
                </div>
            </div>
     <div class="payment-section">
                <h5>Payment Details</h5>
                <div class="card-input">
                    <div class="form-grid">
                        <div class="form-group full-width">
                            <input type="text" placeholder="Card Number" required id="cardNumber">
                        </div>
                        <div class="form-group">
                            <input type="text" placeholder="MM/YY" required id="cardExpiry">
                        </div>
                        <div class="form-group">
                            <input type="text" placeholder="CVV" required id="cardCVV">
                        </div>
                    </div>
                </div>
            </div>

            <button type="submit" class="donate-button" id="donateButton">Complete Donation</button>
        </form>
