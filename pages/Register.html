<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/Style/bootstrap.min.css">
    <link rel="stylesheet" href="/Style/home.css">
    <link rel="stylesheet" href="/Style/auth.css">
    <link rel="stylesheet" href="/assets/fontawason/css/all.min.css">
    <script src="/Js/bootstrap.bundle.min.js"></script>
    <title>Register</title>
</head>
<body>
    <section class="header  header4">
        <div class="header__background"> <img class="header__logo" src="/assets/images/Vectorw.svg"></div>
        <section class="signInForm">
            <div class="signInForm__Div">
                <div class="signInForm__information">
                    <h4>Create New Account</h4>
                    <h5>Get your account now</h5>
                </div>
                <div class="signInForm__Form">
                    <form>
                        <div class="Form__email">
                            <label for="Email">Email</label>
                            <input type="email" id="Email" name="Email" required>
                        </div>
                        <div class="Form__Name">
                            <label for="name">Username </label>
                            <input type="text" id="Username" name="name" required>
                        </div>
                        <div class="Form__Name">
                            <label for="gender">Gender</label>
                            <select id="gender" name="gender" required>
                                <option value="">-- Select Gender --</option>
                                <option value="male">Male</option>
                                <option value="female">Female</option>
                            </select>
                             <div class="Form__Name">
                            <label for="role">role</label>
                            <select id="role" name="role" required>
                                <option value="">-- Select role --</option>
                                <option value="Campaigner">Campaigner </option>
                                <option value="Donor">Donor</option>
                                 <option value="both">both of them</option>
                            </select>
                        </div>
                        <div class="Form__Name">
                            <label for="name">phone Number </label>
                            <input type="tel" id="phoneNum" name="phoneNum" required>
                        </div>
                        <div class="Form__password">
                            <label for="password">Password</label>
                            <input type="password" id="password" name="password" required>
                            <i class="far fa-eye" id="togglePassword" style=" cursor: pointer;"></i>
                        </div>
                        <span class="Form__terms">
                            <p>By registering you agree to the Donation</p><a href="#">Terms of Use</a>
                        </span>
                        <div class="Form__button">
                            <button type="submit"  id="submitbtn">SignUp</button>
                        </div>
                        <div class="Form__socailMedia">
                            <h5>Create account with </h5>
                            <span>
                                <a href="#" class="google" style="text-align: center;"><i
                                        class="fa-brands fa-google"></i></a>
                                <a href="#" class="Facbook" style="text-align: center;"><i
                                        class="fa-brands fa-facebook-f"></i></a>
                                <a href="#" class="github" style="text-align: center;"><i
                                        class="fa-brands fa-github"></i></a>
                                <a href="#" class="twitter" style="text-align: center;"><i
                                        class="fa-brands fa-twitter"></i></a>
                            </span>
                        </div>
                    </form>
                </div>
            </div>
            <section class="FooterSign">
                <span class="FooterSign__sign">
                    <p>Already have an account ?</p><a href="login.html">Sign in</a>
                </span>
            </section>
        </section>
    </section>
    <script src="/Js/funcaions.js"></script>
    <script src="/Js/user.js" defer></script>
</body>

</html>
