    <style>
        :root {
            --primary-color: #121c54;
            --secondary-color: #1e2a6b;
            --third-color: #2a3782;
            --white-color: white;
            --danger-color: #ff3d00;
            --light-blue: #3a4a9c;
            --dark-blue: #121c54;
            --btn-color: #2a3782;
            --dark-brown: #121c54;
            --light-brown: #3a4a9c;
            --light-gray: #e8eaf6;
            --op-gray: #c5cae9;
            --light-yellow: #e8eaf6;
            --degree-one-white: #f5f6fa;
            --card-color: #ffffff;
            --shadow-sm: 0 2px 4px rgba(18, 28, 84, 0.1);
            --shadow-md: 0 4px 6px rgba(18, 28, 84, 0.1);
            --shadow-lg: 0 10px 15px rgba(18, 28, 84, 0.1);
            --transition: all 0.3s ease;
        }

        .header {
            position: relative;
            height: 500px;
            background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)),
                        url('../assets/Images/\(15\).jpg');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            animation: fadeIn 1s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .form-container {
            max-width: 900px;
            margin: -50px auto 2rem;
            padding: 2.5rem;
            background: var(--card-color);
            border-radius: 20px;
            box-shadow: var(--shadow-lg);
            position: relative;
            z-index: 1;
        }

        .tabs {
            display: flex;
            justify-content: space-between;
            margin-bottom: 40px;
            border-bottom: 2px solid var(--light-gray);
        }

        .tab {
            flex: 1;
            text-align: center;
            padding: 15px;
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--secondary-color);
            cursor: pointer;
            border-bottom: 3px solid transparent;
            margin-bottom: -2px;
            transition: var(--transition);
        }

        .tab.active {
            color: var(--primary-color);
            border-bottom-color: var(--primary-color);
        }

        .form-section {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            color: var(--secondary-color);
            font-weight: 600;
            font-size: 1.1rem;
        }

        input[type="text"],
        input[type="email"],
        input[type="date"],
        input[type="number"],
        select,
        textarea {
            padding: 0.8rem 1.2rem;
            border: 1px solid var(--op-gray);
            border-radius: 10px;
            font-size: 1.1rem;
            transition: var(--transition);
            background-color: var(--light-gray);
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(18, 28, 84, 0.1);
            background-color: var(--degree-one-white);
        }

        textarea {
            resize: vertical;
            min-height: 150px;
        }

        .upload-section {
            margin-top: 30px;
            padding: 2rem;
            background: var(--light-gray);
            border-radius: 15px;
            box-shadow: var(--shadow-sm);
            transition: var(--transition);
        }

        .upload-section h3 {
            color: var(--primary-color);
            font-weight: 600;
            margin-bottom: 1.5rem;
        }

        .upload-container {
            border: 2px dashed var(--op-gray);
            padding: 2rem;
            text-align: center;
            border-radius: 15px;
            background-color: var(--degree-one-white);
            cursor: pointer;
            transition: var(--transition);
        }

        .upload-container:hover {
            border-color: var(--primary-color);
            box-shadow: var(--shadow-md);
        }

        .upload-container p {
            color: var(--secondary-color);
            margin-top: 1rem;
        }

        .buttons {
            display: flex;
            gap: 20px;
            margin-top: 2.5rem;
        }

        .btn {
            padding: 1.2rem 2.5rem;
            border-radius: 15px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-primary {
            background: linear-gradient(45deg, var(--primary-color), var(--light-blue));
            color: white;
            border: none;
        }

        .btn-primary:hover {
            background: linear-gradient(45deg, var(--secondary-color), var(--third-color));
            transform: translateY(-3px);
            box-shadow: var(--shadow-lg);
        }

        .btn-secondary {
            background: transparent;
            color: var(--primary-color);
            border: 2px solid var(--primary-color);
        }

        .btn-secondary:hover {
            background: var(--light-gray);
            transform: translateY(-3px);
            box-shadow: var(--shadow-md);
        }

        @media (max-width: 768px) {
            .form-container {
                margin: -30px 1rem 1rem;
                padding: 1.5rem;
            }

            .form-section {
                grid-template-columns: 1fr;
            }

            .buttons {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>

    <div class="form-container">
        <div class="tabs">
            <div class="tab active">Case Details</div>
        </div>
        <form id="createCaseForm">
            <div class="form-section">
                <div class="form-group">
                    <label>Case Title</label>
                    <input type="text" required id="title" placeholder="Enter case title">
                </div>
                <div class="form-group">
                    <label>Category</label>
                    <select required id="category" class="category">
                        <option value="">Select Category</option>
                        <option value="Health">Health</option>
                        <option value="Education">Education</option>
                        <option value="Environment">Environment</option>
                        <option value="Building">Building</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Goal Amount ($)</label>
                    <input type="number" required id="goal" placeholder="Enter goal amount">
                </div>
            </div>
            <div class="form-section">
                <div class="form-group">
                    <label>Location</label>
                    <input type="text" required id="location" placeholder="Enter location">
                </div>
                <div class="form-group">
                    <label>Deadline</label>
                    <input type="date" required id="deadline">
                </div>
            </div>

            <div class="form-section">
                <div class="form-group" style="grid-column: 1 / -1;">
                    <label>Description</label>
                    <textarea required id="description" placeholder="Enter case description"></textarea>
                </div>
            </div>

            <div class="upload-section">
                <h3>Upload Case Image</h3>
                <div class="form-section" style="margin-top: 20px;">
                    <div class="form-group" style="grid-column: 1 / -1;">
                        <label>Upload Image</label>
                        <div class="upload-container">
                            <input type="file" accept="image/*" required id="image">
                            <p style="margin-top: 10px; color: #666;">Supported formats: JPG, PNG, GIF</p>
                            <img src="" alt="" id="displayImage" style="max-width: 200px; margin-top: 10px; display: none;">
                        </div>
                    </div>
                </div>
            </div>

            <div class="buttons">
                <button type="submit" class="btn btn-primary" id="submitCase">Create Case</button>
                <button type="button" class="btn btn-secondary" onclick="window.location.href='cases.html'">Cancel</button>
            </div>
        </form>
    </div>
    <script src="/Js/cases.js"></script>
    <script src="/Js/premmision.js"></script>
